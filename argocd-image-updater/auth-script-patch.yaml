apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater-controller
  namespace: argocd
spec:
  template:
    spec:
      containers:
        - name: argocd-image-updater-controller
          volumeMounts:
            - name: gcr-auth-script
              mountPath: /scripts
      volumes:
        - name: gcr-auth-script
          configMap:
            name: gcr-auth-script
            defaultMode: 0755 # execution permission
