apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yml
  - ./../base
replacements:
  - source:
      fieldPath: metadata.name
      kind: Service
      name: postgres-svc
    targets:
      - fieldPaths:
          - data.DATABASE_HOST
        select:
          kind: ConfigMap
          name: postgres-config
  - source:
      fieldPath: metadata.name
      kind: Service
      name: todo-backend-svc
    targets:
      - fieldPaths:
          - data.BACKEND_HOST
        select:
          kind: ConfigMap
          name: backend-config
images:
  - name: europe-north1-docker.pkg.dev/dwk-gke-501808/docker-images/broadcaster
    newTag: main-c1a5bfdc737111031b9083b17953b67aa9c9c9e8
  - name: europe-north1-docker.pkg.dev/dwk-gke-501808/docker-images/todo-app
    newTag: main-c1a5bfdc737111031b9083b17953b67aa9c9c9e8
  - name: europe-north1-docker.pkg.dev/dwk-gke-501808/docker-images/todo-backend
    newTag: main-c1a5bfdc737111031b9083b17953b67aa9c9c9e8
namespace: staging
namePrefix: stag-
