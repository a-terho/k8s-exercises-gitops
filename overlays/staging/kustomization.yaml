apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yml
  - ./../../base
replacements:
  - source:
      fieldPath: metadata.name
      kind: Service
      name: postgres-svc
    targets:
      - fieldPaths:
          - data.DATABASE_HOST
        select:
          kind: ConfigMap
          name: postgres-config
  - source:
      fieldPath: metadata.name
      kind: Service
      name: todo-backend-svc
    targets:
      - fieldPaths:
          - data.BACKEND_HOST
        select:
          kind: ConfigMap
          name: backend-config
images:
  - name: europe-north1-docker.pkg.dev/dwk-gke-501808/docker-images/broadcaster
    newTag: main-8f45a2cfe1b517e3c2f50b7e6afe8232a3397716
  - name: europe-north1-docker.pkg.dev/dwk-gke-501808/docker-images/todo-app
    newTag: main-8f45a2cfe1b517e3c2f50b7e6afe8232a3397716
  - name: europe-north1-docker.pkg.dev/dwk-gke-501808/docker-images/todo-backend
    newTag: main-8f45a2cfe1b517e3c2f50b7e6afe8232a3397716
namespace: staging
namePrefix: stag-
